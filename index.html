<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blox Hangout - Voice Chat Island</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="logo">
            <span>BLOX</span>
            <span class="accent">HANGOUT</span>
        </div>
        <div class="tagline">Voice Chat Island</div>
        <div class="loader"><div class="loader-fill"></div></div>
        <div class="loading-text">Membangun dunia...</div>
    </div>

    <!-- Main Game UI -->
    <div id="game">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <!-- Top bar -->
            <div id="topBar">
                <div class="hud-pill brand">
                    <span class="dot"></span>
                    <span>BLOX HANGOUT</span>
                </div>
                <div class="hud-pill" id="zoneInfo">
                    <span id="zoneIcon">🌴</span>
                    <span id="zoneName">Spawn Plaza</span>
                </div>
                <div class="hud-pill" id="timeInfo">
                    <span id="timeIcon">☀️</span>
                    <span id="timeName">Siang</span>
                </div>
            </div>

            <!-- Player list -->
            <div id="playerList">
                <div class="panel-title">Di Pulau (5)</div>
                <div class="player-item self">
                    <div class="avatar-mini you"></div>
                    <span class="player-name">You</span>
                    <span class="mic-indicator on" title="Mic aktif">🎤</span>
                </div>
                <div class="player-item">
                    <div class="avatar-mini c1"></div>
                    <span class="player-name">Zara</span>
                    <span class="mic-indicator speaking" title="Berbicara">🔊</span>
                </div>
                <div class="player-item">
                    <div class="avatar-mini c2"></div>
                    <span class="player-name">Rio</span>
                    <span class="mic-indicator on">🎤</span>
                </div>
                <div class="player-item">
                    <div class="avatar-mini c3"></div>
                    <span class="player-name">Luna</span>
                    <span class="mic-indicator off">🔇</span>
                </div>
                <div class="player-item">
                    <div class="avatar-mini c4"></div>
                    <span class="player-name">Kai</span>
                    <span class="mic-indicator speaking">🔊</span>
                </div>
            </div>

            <!-- Bottom controls -->
            <div id="bottomBar">
                <button class="control-btn" id="btnMic" title="Mikrofon (M)">
                    <span class="icon">🎤</span>
                    <span class="label">Mic ON</span>
                </button>
                <button class="control-btn" id="btnDance" title="Menari (E)">
                    <span class="icon">💃</span>
                    <span class="label">Dance</span>
                </button>
                <button class="control-btn" id="btnWave" title="Melambai (Q)">
                    <span class="icon">👋</span>
                    <span class="label">Wave</span>
                </button>
                <button class="control-btn" id="btnTime" title="Siang/Malam (T)">
                    <span class="icon">🌙</span>
                    <span class="label">Malam</span>
                </button>
                <button class="control-btn" id="btnView" title="Ubah Kamera (V)">
                    <span class="icon">📷</span>
                    <span class="label">View</span>
                </button>
            </div>

            <!-- Help -->
            <div id="help">
                <div><kbd>W A S D</kbd> Gerak</div>
                <div><kbd>SPACE</kbd> Lompat</div>
                <div><kbd>SHIFT</kbd> Lari</div>
                <div><kbd>Mouse</kbd> Putar kamera</div>
            </div>

            <!-- Proximity voice indicator -->
            <div id="voiceIndicator">
                <div class="voice-wave"><span></span><span></span><span></span><span></span></div>
                <div class="voice-text">Proximity voice aktif</div>
            </div>

            <!-- Chat bubble (emotes) -->
            <div id="emoteBubble"></div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
